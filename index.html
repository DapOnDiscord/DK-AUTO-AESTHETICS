<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevKev Auto Aesthetics | Cherry Hill, NJ</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0a0a0a;
  color: #d6d6d6;
  line-height: 1.6;
  scroll-behavior: smooth;
}

/* Header with Logo */
header {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #444;
  z-index: 1000;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-logo {
  height: 62px;        /* Nice size for your logo */
  width: auto;
  filter: brightness(1.05);
}

nav a {
  color: #bbbbbb;
  margin-left: 28px;
  text-decoration: none;
  font-size: 15px;
  transition: 0.3s;
}

nav a:hover {
  color: #e0e0e0;
}

/* Hero */
.hero {
  height: 100vh;
  background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), 
              url('https://i.imgur.com/0z9vK8P.jpg') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 0 20px;
}

.hero h1 {
  font-size: 3.8rem;
  color: #e0e0e0;
  letter-spacing: 3px;
  margin-bottom: 12px;
}

.hero .tagline {
  font-size: 1.15rem;
  color: #aaaaaa;
  letter-spacing: 6px;
  text-transform: uppercase;
  margin-bottom: 25px;
}

.hero p {
  max-width: 720px;
  font-size: 1.2rem;
  color: #bbbbbb;
  margin-bottom: 35px;
}

.btn {
  padding: 15px 36px;
  background: linear-gradient(135deg, #c0c0c0, #8a8a8a);
  color: #111;
  border: none;
  font-weight: bold;
  font-size: 1.1rem;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(192,192,192,0.35);
}

/* Sections */
section {
  padding: 110px 40px 90px;
}

.section-title {
  text-align: center;
  font-size: 2.5rem;
  color: #e0e0e0;
  margin-bottom: 60px;
  letter-spacing: 2px;
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 28px;
  max-width: 1250px;
  margin: 0 auto;
}

.card {
  background: linear-gradient(145deg, #1a1a1a, #111111);
  border: 1px solid #555;
  border-radius: 16px;
  padding: 30px;
  transition: 0.4s;
  position: relative;
}

.card:hover {
  transform: translateY(-10px);
  border-color: #999;
  box-shadow: 0 20px 40px rgba(0,0,0,0.7);
}

.card h3 {
  color: #f0f0f0;
  font-size: 1.5rem;
  margin-bottom: 14px;
}

.card .price {
  color: #c0c0c0;
  font-size: 1.35rem;
  font-weight: bold;
  margin: 15px 0;
}
